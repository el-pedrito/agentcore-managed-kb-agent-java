# Endpoint sans authentification en local : ecoute sur 127.0.0.1 par defaut. Sur AgentCore
# Runtime, SERVER_ADDRESS=0.0.0.0 (le Runtime authentifie les appels en SigV4).
server:
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: agentcore-managed-kb-agent
  ai:
    bedrock:
      aws:
        region: ${AWS_REGION:eu-west-1}
        timeout: 60s
      converse:
        chat:
          options:
            # Profil d'inference europeen : l'inference reste dans les regions AWS en Europe.
            model: ${MODEL_ID:eu.anthropic.claude-haiku-4-5-20251001-v1:0}
            temperature: 0
            max-tokens: 1000

techagent:
  knowledge-base-id: ${KNOWLEDGE_BASE_ID}
  max-results: ${MAX_RESULTS:5}
  # Garde-fou d'ancrage de la demo 1. Actif par defaut : sans GUARDRAIL_ID/VERSION, l'agent
  # refuse de demarrer (GROUNDING_CHECK=false pour le desactiver explicitement).
  grounding-check: ${GROUNDING_CHECK:true}
  guardrail-id: ${GUARDRAIL_ID:}
  guardrail-version: ${GUARDRAIL_VERSION:}

management:
  endpoints:
    web:
      exposure:
        include: health
